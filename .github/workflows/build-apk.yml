name: Build NIFTY Option AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Android project
        shell: bash
        run: |
          echo "ROOT:"
          pwd
          echo "ANDROID PROJECT:"
          find android_app -maxdepth 4 -type f | sort
          test -f android_app/settings.gradle
          test -f android_app/build.gradle
          test -f android_app/app/build.gradle
          echo "ANDROID PROJECT FOUND"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android_app
        run: |
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        run: |
          find android_app/app/build/outputs/apk/debug -name "*.apk" -type f -print
          test -f android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-Option-AI-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
