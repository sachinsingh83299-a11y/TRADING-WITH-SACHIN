name: Build NIFTY Option AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Android Gradle project..."

          ANDROID_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Repository structure:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project found at: $ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          echo "Building from: $ANDROID_DIR"

          cd "$ANDROID_DIR"

          echo "Project files:"
          ls -la

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$ANDROID_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-Option-AI-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
