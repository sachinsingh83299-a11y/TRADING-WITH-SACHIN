name: Build NIFTY Option AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== MAIN ==="
          find app/src/main -maxdepth 5 -type f | sort

      - name: Show Gradle tasks
        run: |
          gradle tasks --all --stacktrace --no-daemon

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-Option-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
