name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Locate Android project
        run: |
          if [ -d "android" ]; then
            echo "Android project found in root"
          elif [ -d "android_app/android" ]; then
            echo "Android project found in android_app"
          else
            echo "ERROR: Android project not found"
            find . -maxdepth 3 -type d | sort
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          if [ -d "android" ]; then
            cd android
          else
            cd android_app/android
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android_app/android/app/build/outputs/apk/debug/*.apk
