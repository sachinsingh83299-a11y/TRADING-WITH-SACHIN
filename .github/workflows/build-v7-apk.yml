      - name: Check V7 Android project
        shell: bash
        run: |
          set -e

          echo "===== REPOSITORY ROOT ====="
          pwd

          echo "===== ANDROID APP TREE ====="
          find android_app -maxdepth 6 -type f | sort || true

          echo "===== CHECKING REQUIRED FILES ====="

          files=(
            "android_app/settings.gradle"
            "android_app/build.gradle"
            "android_app/app/build.gradle"
            "android_app/app/src/main/AndroidManifest.xml"
            "android_app/app/src/main/java/com/sachin/niftyoptionai/MainActivity.java"
          )

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
            fi
          done

          echo "===== END CHECK ====="
