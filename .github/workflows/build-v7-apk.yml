name: Build NIFTY Option AI V7 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-v7-apk:
    name: Build V7 Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V7 Android project
        shell: bash
        run: |
          set -e

          echo "Repository root:"
          pwd

          echo "Checking V7 Android project..."

          test -f android_app/settings.gradle
          test -f android_app/build.gradle
          test -f android_app/app/build.gradle
          test -f android_app/app/src/main/AndroidManifest.xml
          test -f android_app/app/src/main/java/com/sachin/niftyoptionai/MainActivity.java

          echo "V7 Android project found successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          echo "settings.gradle:"
          cat android_app/settings.gradle

          echo "build.gradle:"
          cat android_app/build.gradle

          echo "app/build.gradle:"
          cat android_app/app/build.gradle

          echo "Available Android tasks:"
          gradle \
            -p android_app \
            :app:tasks \
            --all \
            --no-daemon

      - name: Build V7 Debug APK
        shell: bash
        run: |
          set -e

          gradle \
            -p android_app \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android_app/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not created."
            echo "Searching for APK files:"
            find android_app -type f -name "*.apk" -print
            exit 1
          fi

          echo "
