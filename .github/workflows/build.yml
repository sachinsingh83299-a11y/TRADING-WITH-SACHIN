name: Build NIFTY Option AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project
        run: |
          echo "ROOT:"
          pwd
          echo "FILES:"
          find . -maxdepth 3 -type f | sort

      - name: Install npm dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install

      - name: Build web app
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build

      - name: Check Android project
        run: |
          test -f android_app/settings.gradle
          test -f android_app/build.gradle
          test -f android_app/app/build.gradle
          echo "ANDROID PROJECT FOUND"

      - name: Build APK
        working-directory: android_app
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          find android_app -name "*.apk" -type f -print
          test -f android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-Option-AI-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
