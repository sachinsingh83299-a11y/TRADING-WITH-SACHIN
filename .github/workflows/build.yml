name: Build NIFTY Option AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project
        working-directory: android_app
        run: |
          pwd
          find . -maxdepth 5 -type f | sort
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "ANDROID PROJECT OK"

      - name: Build APK
        working-directory: android_app
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          find android_app -type f -name "*.apk" -print
          test -f android_app/app/build/outputs/apk/debug/app-debug.apk
          echo "APK BUILD SUCCESS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-Option-AI-V7-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
