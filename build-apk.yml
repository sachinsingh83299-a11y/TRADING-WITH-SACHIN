name: Build NIFTY Option AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          ANDROID_DIR=$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \\
            -not -path './.git/*' -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project: $ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          echo "Building from: $(pwd)"
          ls -la
          gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "Generated APK files:"
          find "$ANDROID_DIR" -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIFTY-Option-AI-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
