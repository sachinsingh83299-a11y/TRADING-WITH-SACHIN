name: Build NIFTY Option AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show project files
        run: |
          echo "===== PROJECT ====="
          ls -la
          echo "===== PACKAGE ====="
          cat package.json

      - name: Install dependencies
        run: npm install

      - name: Remove old Android folder
        run: |
          rm -rf android
          echo "Old android folder removed."

      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean \
            --non-interactive

      - name: Verify Android project
        run: |
          echo "===== ANDROID ====="
          ls -la android
          echo "===== SETTINGS.GRADLE ====="
          cat android/settings.gradle
          echo "===== GRADLE VERSION ====="
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: NIFTY-Option-AI-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
